# OnebotNoa 配置样例 —— 这是「进程级静态配置」。
#
# 程序启动后会自主生成两份文件，职责严格分开：
#
#   config.yaml      本文件。手工维护，改动后需要重启。
#                    监听地址、端点路径、限速与背压策略、日志。
#
#   connect.json     程序生成。连接、账号、Bot、绑定，以及它们需要的密钥。
#                    在 WebUI 里改，或直接编辑文件（改完重启即生效）；
#                    也可以整体导出/导入，用来备份或在另一台机器上恢复。
#
#   connect.json.key 与 connect.json 配套的本地密钥（0600）。connect.json 里的
#                    token 用它加密，所以文档可以单独复制/贴进工单，而不等于
#                    交出凭据。**两者要分开备份**：丢了密钥，已加密的 token
#                    无法恢复（重新签发即可）。
#
# 判断某个配置该放哪里：需要重启 → 这里；运行中还要改 → connect.json。

server:
  listen: 127.0.0.1:8080          # 默认只监听本机；公网部署请置于反代之后
  tls_cert: ""                    # 与 tls_key 同时设置才启用 HTTPS
  tls_key: ""
  admin_bootstrap_password: ""    # 留空则首次启动生成随机密码并打印到控制台
  trust_proxy: false              # 置于反代之后时置 true 以信任 X-Forwarded-*
  read_header_timeout: 10s
  shutdown_timeout: 8s

onebot:
  upstream_ws:                    # QQ 侧（OneBot 实现端）接入：单端点多实例
    enable: true
    path: /onebot/v11/ws
    require_token: true
    allow_query_token: true
    bootstrap_token: ""          # 首次接入用的共享令牌（留空则只认账号级 token）
    unknown_account_policy: pending   # pending | reject | auto
    identity_timeout: 3s              # 首帧兜底识别窗口
  downstream_ws:                  # Bot 侧（OneBot 应用端）接入
    enable: true
    path: /onebot/v11/bot/ws
    require_token: true
  http:                           # OneBot HTTP 兼容层
    enable: true
    api_path: /onebot/v11/http
    report_path: /onebot/v11/report
    quick_operation: false        # 多 Bot 下语义含混，默认关闭
    max_body_bytes: 4194304

policy:
  action_timeout: 15s             # 动作端到端超时
  stream_idle_timeout: 60s        # 流式动作空闲超时（每帧刷新）
  stream_max_timeout: 10m         # 流式动作硬上限
  offline_action_policy: fail_fast    # fail_fast | queue
  queue: { size: 256, ttl: 10s }
  bot_backpressure: drop_oldest   # drop_oldest | drop_newest | disconnect | block
  write_queue_size: 1024
  meta_events: synthetic          # synthetic | passthrough | drop
  heartbeat_interval: 5s
  per_account_rate: { rate: 1, burst: 5 }          # 账号级全局令牌桶（多个 Bot 共享，防风控；0=关闭）
                                                   # 只对会发送/改状态的动作生效，get_* / can_* 不限速
  per_bot_rate: { rate: 5, burst: 10, concurrency: 4 }
  pending_per_conn: 512
  pending_global: 8192
  ping_interval: 30s
  pong_timeout: 10s

storage:
  sqlite: ./data/onebotnoa.db     # 管理数据库：登录、会话、设置、审计
  connect_file: ./data/connect.json       # 连接文档（程序生成）
  connect_key: ./data/connect.json.key    # 加密密钥（程序生成，与上面分开保存）
  event_ring: 2000
  session_ttl: 168h

metrics:
  enable: true                    # 暴露 /metrics（Prometheus 文本格式）；默认只监听本机

log:
  level: info                     # debug | info | warn | error
  format: json                    # json | text
  add_source: false

# ---------------------------------------------------------------------------
# 以下内容已不在本文件里，全部搬到 connect.json：
#
#   accounts       QQ 实例、别名、状态、以及每个实例的 token
#   bots           下游应用、策略（rate_limit / action_policy）、token
#   connections    四种连接方式（upstream/downstream × listen/dial），含独立端口与 TLS
#   bindings       哪个 Bot 可以用哪个账号，以及过滤范围
#
# 在 WebUI 里管理，或直接编辑 connect.json（参考下面这份结构示例）。
# 旧版本写在 config.yaml 里的 endpoints / dedicated 已不再被识别：
# 首次启动新版本时会自动从数据库迁移一次，之后请用 WebUI 或 connect.json。
#
# connect.json 结构：
#
# {
#   "schema_version": 1,
#   "accounts": [
#     { "id": 1, "self_id": "10001", "name": "主号", "enabled": true,
#       "grant": { "token": "enc:v1:...", "token_hash": "...", "sealed": true } }
#   ],
#   "bots": [
#     { "id": 1, "name": "nonebot-main", "enabled": true,
#       "rate_limit": {}, "action_policy": { "deny": ["set_group_ban"] },
#       "grant": { "token": "enc:v1:...", "sealed": true } }
#   ],
#   "connections": [
#     // QQ 实例主动接入：给某个账号单独开一个端口
#     { "id": 1, "name": "qq-10001", "kind": "upstream_listen",
#       "addr": "127.0.0.1:6710", "path": "/onebot/v11/ws",
#       "account_self_id": "10001", "enabled": true },
#     // 中继主动连 QQ 实现端
#     { "id": 2, "name": "dial-qq", "kind": "upstream_dial",
#       "url": "ws://10.0.0.5:6700/", "mode": "universal",
#       "account_self_id": "10002", "enabled": true,
#       "reconnect": { "min": "1s", "max": "60s", "jitter": 0.3 },
#       "grant": { "token": "enc:v1:..." } },
#     // Bot 主动接入：这个端口只服务一个 Bot
#     { "id": 3, "name": "bot-nonebot", "kind": "downstream_listen",
#       "addr": "127.0.0.1:6810", "path": "/onebot/v11/bot/ws",
#       "bot_name": "nonebot-main", "fixed_self_id": "10001",
#       "tls_cert": "", "tls_key": "", "enabled": true },
#     // 中继主动连 Bot
#     { "id": 4, "name": "dial-bot", "kind": "downstream_dial",
#       "url": "ws://10.0.0.9:8080/onebot/v11/ws",
#       "bot_name": "nonebot-main", "enabled": true }
#   ],
#   "bindings": [
#     { "id": 1, "bot_name": "nonebot-main", "account_self_id": "10001",
#       "priority": 100, "is_default": true, "enabled": true,
#       "scope": { "post_types": ["message"], "exclude_self": true } }
#   ]
# }
#
# 手写注意：
#   * grant.token 可以直接写明文，程序下次保存时会自动加密；
#   * 上游独立监听必须给出 account_self_id（否则谁都能连这个端口）；
#   * 下游拨号必须给出 bot_name；下游独立监听必须给出 bot_name；
#   * 同一时刻每个 Bot 只能有一个 is_default（路由未指定 self_id 时用它）。
